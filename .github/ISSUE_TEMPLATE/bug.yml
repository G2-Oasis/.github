name: Bug
description: Algo que não funciona como deveria.
title: "[Bug] "
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como repetir
      description: Passo a passo até o erro aparecer.
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Onde aconteceu
      description: Ambiente e tela.
    validations:
      required: true
  - type: input
    id: horas
    attributes:
      label: Horas previstas
      description: Preencha depois de analisar. Só o número de horas.
    validations:
      required: false
